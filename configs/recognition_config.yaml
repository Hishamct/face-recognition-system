# Face Recognition & Matching Configuration
recognition:
  model_name: "sface_2021dec"
  model_path: "models/face_recognition_sface_2021dec.onnx"
  embedding_dimension: 128
  metric: "cosine"
  default_decision_threshold: 0.300 # empirical threshold calibrated on validation set (FAR <= 1%)
  unknown_label: "Unknown"
  faiss_index_type: "IndexFlatIP"
  index_path: "data/database/faiss_index.bin"
  metadata_path: "data/database/gallery_metadata.json"
