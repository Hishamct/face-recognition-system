# Face Detection & Alignment Configuration
detector:
  model_name: "yunet_2023mar"
  model_path: "models/face_detection_yunet_2023mar.onnx"
  score_threshold: 0.75
  nms_threshold: 0.3
  top_k: 5000
  device: "cpu"

alignment:
  enabled: true
  canonical_crop_size: [112, 112]
  reference_standard: "arcface_5point"
